name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Google が運営している Maven Central のミラー（Robolectric 用）
  ROBOLECTRIC_REPO_URL: https://maven-central.storage-download.googleapis.com/maven2/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest には Android SDK が入っている（ANDROID_HOME）
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (core logic)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'app.duotrainer.core.*'

      # Robolectric が使う Android の jar は大きく、Maven Central の制限にかかりやすいのでキャッシュする
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-v1

      # 語順パズルのドラッグ（画面の操作テスト）。ダウンロード制限に備えて 3 回まで再試行
      - name: UI test (puzzle drag)
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon testDebugUnitTest --tests 'app.duotrainer.ui.ScreenshotTest.puzzleDragReorders' -i > ui-test.log 2>&1 && ok=1 && break
            grep -q "Failed to fetch maven artifact" ui-test.log || break
            echo "download limited, retry $i"; sleep 60
          done
          grep -E "DRAG|FAILED|Assertion" ui-test.log || true
          [ "${ok:-0}" = 1 ]

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-v1

      # 画面のスクリーンショット（自作サンプル例文で描画）。失敗しても APK は作る。
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon recordRoborazziDebug --tests 'app.duotrainer.ui.*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/*.png

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk duo-trainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: duo-trainer-apk
          path: duo-trainer.apk

      # main に push するたびに「latest」リリースの APK を差し替える（スマホから直接ダウンロードできる）
      - name: Move latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド
          prerelease: true
          make_latest: false
          files: duo-trainer.apk
          body: |
            main ブランチの最新ビルドです（${{ github.sha }}）。
            スマホでこのページを開き、duo-trainer.apk をダウンロードしてインストールしてください。

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: duo-trainer.apk
          generate_release_notes: true
